services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clinica_app
    restart: unless-stopped
    working_dir: /var/www
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
      - clinica_vendor:/var/www/vendor
      - clinica_storage:/var/www/storage
      - clinica_cache:/var/www/bootstrap/cache
      - ./backend/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh
      - ./backend/docker/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: clinica_vida_salud
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      PHP_CLI_SERVER_WORKERS: 6
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    command: ["php", "-S", "0.0.0.0:8000", "-t", "public"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: clinica_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinica_vida_salud
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - clinica_pgdata:/var/lib/postgresql/data
      - ./backend/database/poblacion_completa_clinica.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinica_vida_salud"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  clinica_pgdata:
    driver: local
  clinica_vendor:
    driver: local
  clinica_storage:
    driver: local
  clinica_cache:
    driver: local
